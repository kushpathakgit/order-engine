
services:
  postgres:
    image: postgres:17
    container_name: order-engine-db
    environment:
      POSTGRES_DB: order_engine
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_user -d order_engine"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
